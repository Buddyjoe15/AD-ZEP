<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111713">
  <title>Groundfall — v0.7.0 Master</title>
  <style>:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#111713;color:#e8eee8}
body{touch-action:none;user-select:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#40513c}
#topbar{position:absolute;left:10px;right:10px;top:10px;min-height:48px;background:#101713e8;border:1px solid #536054;border-radius:8px;display:flex;align-items:center;gap:14px;padding:7px 10px;pointer-events:auto}
.brand{font-weight:800;letter-spacing:.08em;white-space:nowrap}.brand span{font-size:11px;font-weight:600;color:#a8b5a9}
#status{font-size:12px;color:#cad5ca;flex:1;min-width:0}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{min-height:34px;border:1px solid #657468;border-radius:6px;background:#243127;color:#eef5ee;font-weight:700;padding:6px 10px;cursor:pointer}
button:hover{background:#34463a}button:active{transform:translateY(1px)}
#help{position:absolute;left:10px;bottom:10px;max-width:min(700px,calc(100% - 260px));background:#101713dd;border:1px solid #536054;border-radius:7px;padding:8px 11px;font-size:12px;color:#d7ded7;pointer-events:none}
.panel{position:absolute;background:#101713e8;border:1px solid #536054;border-radius:8px;padding:10px;pointer-events:none}
#selectionPanel{left:10px;bottom:48px;min-width:190px;min-height:46px;font-size:12px}
#minimap{position:absolute;right:10px;bottom:10px;width:220px;height:220px;background:#172018e8;border:2px solid #6d796e;border-radius:8px;pointer-events:auto}
.dev{right:10px;top:68px;min-width:225px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d9f5da}
.hidden{display:none}
#toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);background:#101713ef;border:1px solid #677668;border-radius:6px;padding:7px 12px;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none}
@media(max-width:700px){
  #topbar{left:5px;right:5px;top:5px;padding:5px 6px;gap:6px}.brand{font-size:12px}#status{display:none}
  button{min-width:44px;min-height:40px;padding:5px 7px;font-size:11px}
  #minimap{width:145px;height:145px;right:5px;bottom:5px}
  #help{left:5px;bottom:5px;max-width:calc(100% - 160px);font-size:10px;padding:6px}
  #selectionPanel{left:5px;bottom:45px;min-width:145px;padding:7px;font-size:10px}
  .dev{right:5px;top:58px;min-width:190px;font-size:10px}
}

.rpg{right:10px;top:68px;width:min(360px,calc(100% - 20px));max-height:calc(100% - 90px);overflow:auto;pointer-events:auto}
.rpg h3{margin:0 0 9px;font-size:15px}.rpg h4{margin:12px 0 6px;font-size:12px;color:#b9c5ba;text-transform:uppercase;letter-spacing:.08em}
.slot,.itemrow,.skillrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #39463c;padding:7px 0;font-size:12px}
.slot:first-of-type,.itemrow:first-of-type{border-top:0}.muted{color:#9eaaa0}.dur{font-size:10px;color:#c8d1c8}.bar{height:5px;background:#273228;border-radius:5px;overflow:hidden;margin-top:3px}.bar>i{display:block;height:100%;background:#c7aa58}
.rpg button{min-height:30px;font-size:11px}.searchbar{height:8px;background:#273228;border-radius:5px;overflow:hidden;margin:8px 0}.searchbar>i{display:block;height:100%;background:#73a9d8}
@media(max-width:700px){.rpg{right:5px;top:58px;width:min(320px,calc(100% - 10px));max-height:calc(100% - 70px)}}

/* v0.2.1 inventory redesign: grid-based survival inventory inspired by classic block-game layouts,
   using original styling and game-specific equipment slots. */
.inventory-shell{display:grid;grid-template-columns:92px 1fr;gap:12px;min-width:0}
.equipment-column{display:grid;grid-template-columns:1fr;gap:6px;align-content:start}
.equipment-label{font-size:10px;color:#b8c2b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.inv-slot{
  width:52px;height:52px;border:2px solid #222922;border-right-color:#81887e;border-bottom-color:#81887e;
  background:#4c534c;display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:inset 2px 2px 0 #343a34,inset -2px -2px 0 #687068;cursor:pointer;
}
.inv-slot:hover{outline:2px solid #dfe7d8;outline-offset:-3px}
.inv-slot.empty{cursor:default}
.inv-slot.locked{background:#252a26;opacity:.52;cursor:not-allowed}
.inv-slot.locked::after{content:"×";font-size:22px;color:#7b837b}
.inv-slot.selected-slot{outline:2px solid #f1dc74;outline-offset:-3px}
.inv-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;text-align:center;line-height:1.05;color:#eff5ed;text-shadow:0 1px 2px #000}
.inv-icon.hat{border-radius:4px 4px 12px 12px;background:#5c704d;border:2px solid #2d3927;position:relative}
.inv-icon.hat::before{content:"";position:absolute;left:-7px;right:-7px;bottom:-5px;height:7px;background:#44573c;border:2px solid #2d3927;border-radius:2px}
.inv-durability{position:absolute;left:5px;right:5px;bottom:4px;height:4px;background:#1a1e1a;border:1px solid #101310}
.inv-durability>i{display:block;height:100%;background:#b8d45f}
.slot-tag{position:absolute;left:3px;top:2px;font-size:8px;color:#c8d0c8;pointer-events:none}
.inventory-main{min-width:0}
.character-pane{height:176px;border:2px solid #282e28;border-right-color:#7c837a;border-bottom-color:#7c837a;background:#353c36;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.character-figure{width:68px;height:122px;position:relative}
.character-figure .head{position:absolute;left:19px;top:0;width:30px;height:30px;background:#c5a27b;border:2px solid #242a25}
.character-figure .body{position:absolute;left:14px;top:32px;width:40px;height:48px;background:#42678b;border:2px solid #242a25}
.character-figure .arm{position:absolute;top:35px;width:12px;height:46px;background:#bd966f;border:2px solid #242a25}
.character-figure .arm.l{left:1px}.character-figure .arm.r{right:1px}
.character-figure .leg{position:absolute;top:79px;width:18px;height:43px;background:#39454f;border:2px solid #242a25}
.character-figure .leg.l{left:14px}.character-figure .leg.r{right:14px}
.inventory-section-title{font-size:10px;color:#cbd3ca;text-transform:uppercase;letter-spacing:.09em;margin:8px 0 5px}
.inventory-grid{display:grid;grid-template-columns:repeat(9,52px);gap:3px;width:max-content;max-width:100%}
.inventory-scroll{overflow-x:auto;padding-bottom:3px}
.inventory-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.inventory-details{margin-top:8px;padding:8px;background:#252c27;border:1px solid #465248;font-size:11px;min-height:54px}
.inventory-details b{color:#f1f4ef}
.inventory-count{font-size:11px;color:#cbd4cb;margin-bottom:8px}
.equip-slot-wrap{display:flex;align-items:center;gap:6px}
.equip-slot-name{font-size:9px;color:#aeb9ae;min-width:38px}
@media(max-width:700px){
  .inventory-shell{grid-template-columns:64px 1fr;gap:8px}
  .inv-slot{width:42px;height:42px}.inventory-grid{grid-template-columns:repeat(9,42px);gap:2px}
  .inv-icon{width:30px;height:30px;font-size:9px}.character-pane{height:135px}.character-figure{transform:scale(.82)}
  .equip-slot-name{display:none}
}

/* v0.2.3 split inventory/container workspace */
#inventoryPanel.rpg{left:10px;right:auto;top:68px;width:min(460px,calc(50% - 20px));max-height:calc(100% - 90px);overflow:auto;pointer-events:auto}
#chestPanel.rpg{right:10px;left:auto;top:68px;width:min(390px,calc(50% - 20px));max-height:calc(100% - 90px);overflow:auto;pointer-events:auto}
#skillsPanel.rpg{right:10px;left:auto}
.container-grid{display:grid;grid-template-columns:repeat(5,52px);gap:4px;width:max-content;max-width:100%;padding:5px}
.container-drop-zone,.backpack-drop-zone{border:2px dashed #68756b;border-radius:6px;padding:6px;min-height:64px}
.container-drop-zone.drop-active,.backpack-drop-zone.drop-active{border-color:#f0d66d;background:#30392f}
.drag-ghost{position:fixed;z-index:9999;width:48px;height:48px;pointer-events:none;opacity:.88;transform:translate(-24px,-24px);background:#4c534c;border:2px solid #d9dfd5;display:flex;align-items:center;justify-content:center}
.item-info-menu{position:fixed;z-index:10000;width:min(300px,calc(100% - 24px));background:#111814;border:1px solid #788579;border-radius:7px;padding:10px;box-shadow:0 8px 24px #0009;pointer-events:auto}
.item-info-menu h4{margin:0 0 6px;font-size:14px}.item-info-menu p{margin:4px 0;font-size:11px;color:#d1d9d1}.item-info-menu .close-info{width:100%;margin-top:8px}
.inv-slot.item-live{touch-action:none;cursor:grab}.inv-slot.item-live:active{cursor:grabbing}
.container-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.transfer-hint{font-size:10px;color:#aeb9ae;margin:5px 0 8px}
@media(max-width:850px){
  #inventoryPanel.rpg{left:5px;right:auto;top:58px;width:calc(58% - 8px);max-height:calc(100% - 68px)}
  #chestPanel.rpg{right:5px;left:auto;top:58px;width:calc(42% - 8px);max-height:calc(100% - 68px)}
  .container-grid{grid-template-columns:repeat(3,42px);gap:3px}
}

/* v0.2.4 landscape-first interface cleanup */
:root{
  --ui-top:52px;
  --panel-gap:6px;
  --slot-size:40px;
}
#topbar{
  left:max(6px,env(safe-area-inset-left));
  right:max(6px,env(safe-area-inset-right));
  top:max(6px,env(safe-area-inset-top));
  min-height:40px;
  padding:4px 7px;
  gap:7px;
  border-radius:6px;
}
.brand{font-size:12px;letter-spacing:.055em}
.brand span{font-size:9px}
#status{font-size:10px}
.actions{gap:4px;flex-wrap:nowrap}
#topbar button{min-height:30px;padding:3px 7px;font-size:10px;border-radius:5px;white-space:nowrap}
.panel{padding:7px;border-radius:6px}
.rpg h3{margin:0 0 5px;font-size:12px}
.rpg h4{margin:7px 0 4px;font-size:10px}
.rpg button{min-height:27px;padding:3px 7px;font-size:9px}
.muted,.transfer-hint,.inventory-count{font-size:9px;line-height:1.25}
.inventory-count{margin-bottom:4px}
.transfer-hint{margin:3px 0 5px}

#inventoryPanel.rpg{
  left:max(6px,env(safe-area-inset-left));
  right:auto;
  top:var(--ui-top);
  width:min(410px,48vw);
  max-height:calc(100% - var(--ui-top) - max(6px,env(safe-area-inset-bottom)));
  overflow:auto;
}
#chestPanel.rpg{
  right:max(6px,env(safe-area-inset-right));
  left:auto;
  top:var(--ui-top);
  width:min(330px,39vw);
  max-height:calc(100% - var(--ui-top) - max(6px,env(safe-area-inset-bottom)));
  overflow:auto;
}
#skillsPanel.rpg{
  right:max(6px,env(safe-area-inset-right));
  top:var(--ui-top);
  width:min(310px,42vw);
  max-height:calc(100% - var(--ui-top) - 6px);
}
.dev{
  right:max(6px,env(safe-area-inset-right));
  top:var(--ui-top);
  min-width:185px;
  max-height:calc(100% - var(--ui-top) - 6px);
  overflow:auto;
  font-size:9px;
}

.inventory-shell{
  grid-template-columns:62px minmax(0,1fr);
  gap:7px;
}
.equipment-column{gap:3px}
.equipment-label{font-size:8px;margin-bottom:1px}
.equip-slot-wrap{gap:3px}
.equip-slot-name{display:none}
.inv-slot{
  width:var(--slot-size);
  height:var(--slot-size);
  border-width:1px;
  box-shadow:inset 1px 1px 0 #343a34,inset -1px -1px 0 #687068;
}
.inv-icon{width:27px;height:27px;font-size:8px}
.inv-icon.hat{border-width:1px}
.inv-icon.hat::before{left:-5px;right:-5px;bottom:-4px;height:5px;border-width:1px}
.inv-durability{left:3px;right:3px;bottom:2px;height:3px}
.slot-tag{font-size:7px;left:2px;top:1px}
.inventory-grid{
  grid-template-columns:repeat(9,var(--slot-size));
  gap:2px;
  width:max-content;
}
.inventory-scroll{overflow-x:auto;padding:3px 0}
.backpack-drop-zone{padding:3px;min-height:48px}
.character-pane{
  height:84px;
  margin-bottom:5px;
  border-width:1px;
}
.character-figure{
  width:68px;height:122px;
  transform:scale(.56);
}
.inventory-section-title{font-size:8px;margin:4px 0 3px}
.container-grid{
  grid-template-columns:repeat(5,var(--slot-size));
  gap:3px;
  padding:3px;
}
.container-drop-zone{padding:4px;min-height:52px}
.container-title-row h3{margin:0}
.container-title-row button{min-width:28px;padding:2px 6px}
.searchbar{height:6px;margin:5px 0}
.item-info-menu{
  width:min(260px,calc(100% - 16px));
  padding:8px;
}
.item-info-menu h4{font-size:12px;margin-bottom:4px}
.item-info-menu p{font-size:9px;line-height:1.3}
.drag-ghost{width:40px;height:40px;transform:translate(-20px,-20px);font-size:9px}

#minimap{
  width:150px;height:150px;
  right:max(6px,env(safe-area-inset-right));
  bottom:max(6px,env(safe-area-inset-bottom));
  border-radius:6px;
}
#selectionPanel{
  left:max(6px,env(safe-area-inset-left));
  bottom:36px;
  min-width:140px;
  min-height:34px;
  padding:5px;
  font-size:9px;
}
#help{
  left:max(6px,env(safe-area-inset-left));
  bottom:max(6px,env(safe-area-inset-bottom));
  max-width:calc(100% - 170px);
  padding:5px 7px;
  font-size:9px;
  border-radius:5px;
}
#toast{
  top:var(--ui-top);
  padding:5px 9px;
  font-size:10px;
}

#rotateHint{
  display:none;
  position:absolute;
  inset:0;
  z-index:20000;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  background:#0e140ff2;
  color:#edf3ed;
  font-size:14px;
  pointer-events:none;
}
#rotateHint b{font-size:18px}

/* Landscape phone/tablet tuning */
@media (orientation:landscape) and (max-height:520px){
  :root{--ui-top:46px;--slot-size:34px}
  #topbar{min-height:34px;padding:3px 5px}
  .brand{font-size:10px}.brand span{font-size:8px}
  #status{font-size:9px}
  #topbar button{min-height:27px;padding:2px 5px;font-size:9px}
  #inventoryPanel.rpg{width:min(370px,48vw)}
  #chestPanel.rpg{width:min(280px,38vw)}
  #skillsPanel.rpg{width:min(280px,38vw)}
  .inventory-shell{grid-template-columns:48px minmax(0,1fr);gap:5px}
  .character-pane{height:66px}
  .character-figure{transform:scale(.44)}
  .inventory-grid{gap:1px}
  .equipment-column{gap:2px}
  .container-grid{grid-template-columns:repeat(5,var(--slot-size));gap:2px}
  #minimap{width:118px;height:118px}
  #help{max-width:calc(100% - 132px);font-size:8px}
  #selectionPanel{font-size:8px;bottom:31px}
  .rpg h3{font-size:11px}
}

/* Very short landscape displays */
@media (orientation:landscape) and (max-height:390px){
  :root{--ui-top:42px;--slot-size:30px}
  #topbar{left:4px;right:4px;top:4px;gap:3px}
  .brand{font-size:9px}
  #status{display:none}
  #topbar button{min-height:25px;padding:2px 4px;font-size:8px}
  #inventoryPanel.rpg{left:4px;width:47vw;padding:5px}
  #chestPanel.rpg{right:4px;width:37vw;padding:5px}
  .character-pane{height:52px}
  .character-figure{transform:scale(.35)}
  .transfer-hint{display:none}
  .inventory-count{font-size:8px}
  #minimap{width:96px;height:96px;right:4px;bottom:4px}
  #help{font-size:7px;left:4px;bottom:4px;max-width:calc(100% - 108px)}
  #selectionPanel{left:4px;bottom:27px;font-size:7px;min-width:120px}
}

/* Portrait remains functional, but clearly recommends the intended orientation. */
@media (orientation:portrait) and (max-width:700px){
  #rotateHint{display:flex}
}

/* v0.2.5 progression */
.progression-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:9px;color:#d6ddd6;margin:2px 0 3px}
.progression-row b{color:#f1e39a}
.xpbar{height:5px;background:#242d26;border:1px solid #465249;border-radius:4px;overflow:hidden;margin:3px 0 5px}
.xpbar>i{display:block;height:100%;background:#8fb35e}
@media (orientation:landscape) and (max-height:390px){
  .progression-row{font-size:8px}
  .xpbar{height:4px;margin:2px 0 3px}
}

/* v0.2.6 body-overlay equipment grid */
.inventory-main{min-width:0}
.equipped-character{
  position:relative;
  height:190px;
  overflow:hidden;
  background:#313832;
  border:1px solid #657067;
}
.equipped-character .character-figure{
  position:absolute;
  left:50%;
  top:50%;
  width:68px;
  height:122px;
  transform:translate(-50%,-50%) scale(.82);
  transform-origin:center;
  opacity:.92;
}
.body-equip-slot{
  position:absolute;
  width:34px;
  height:34px;
  z-index:4;
  background:#424a43d9;
  border:1px solid #202620;
}
.body-equip-slot.empty{background:#343b35b8}
.body-equip-slot .body-slot-label{
  position:absolute;
  left:50%;
  top:50%;

  width:100%;

  font-size:6px;
  line-height:1.05;
  color:#c3cbc3;
  pointer-events:none;

.body-equip-slot.item-live .body-slot-label{display:none}
.body-equip-slot[data-drop-zone="equipment"]{outline:1px dashed #788278;outline-offset:-2px}
.body-equip-slot[data-drop-zone="equipment"]:hover{outline:2px solid #f0d76f;outline-offset:-3px}

.slot-head{left:calc(50% - 17px);top:4px}
.slot-chest{left:calc(50% - 17px);top:52px}
.slot-left-arm{left:calc(50% - 70px);top:50px}

.slot-right-hand{left:calc(50% + 52px);top:91px}

.slot-backpack{right:6px;top:10px}

  <script>
(function(){
const G=GW,C=G.CONFIG,RNG=G.RNG;const idx=(x,y)=>y*C.COLS+x;const ship=()=>G.State.units.find(u=>u.id===G.State.shipId&&u.hp>0);
const TT={
  GRASS:0,PATH:1,WATER:2,ROCK:3,FOREST:4,TREE:5,BUSH:6,BRIDGE:7,
  FLOOR:8,WALL:9,DOOR:10,CLEARING:11
};

class ForestMap{
  constructor(seed){
    this.seed=seed;
    this.tiles=new Uint8Array(C.COLS*C.ROWS);
    this.chunks=new Map();

    this.age=0;
    this.buildings=[];

  }
  set(x,y,t){if(x>=0&&y>=0&&x<C.COLS&&y<C.ROWS)this.tiles[idx(x,y)]=t}
  get(x,y){return(x<0||y<0||x>=C.COLS||y>=C.ROWS)?TT.ROCK:this.tiles[idx(x,y)]}
  passable(x,y){
    if(x<0||y<0||x>=C.COLS||y>=C.ROWS)return false;
    const t=this.get(x,y);
    if(t===TT.WATER||t===TT.ROCK||t===TT.TREE||t===TT.WALL)return false;
    const sh=ship();
    if(sh&&x>=sh.gx&&x<sh.gx+sh.w&&y>=sh.gy&&y<sh.gy+sh.h)return false;
    for(const b of G.State.buildings||[])if(b.hp>0&&x>=b.gx&&x<b.gx+b.w&&y>=b.gy&&y<b.gy+b.h)return false;
    return true;
  }
  moveCost(x,y){
    const t=this.get(x,y);
    if(t===TT.PATH||t===TT.BRIDGE)return .82;
    if(t===TT.FOREST||t===TT.BUSH)return 1.22;
    return 1;
  }
  clearRect(x0,y0,w,h,t=TT.CLEARING){
    for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)this.set(x,y,t)
  }
  paintDisc(cx,cy,r,t,only=null){
    for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){
      if(x<0||y<0||x>=C.COLS||y>=C.ROWS)continue;
      if(Math.hypot(x-cx,y-cy)<=r&&(only===null||this.get(x,y)===only))this.set(x,y,t)
    }
  }
  paintPath(points,width=2,t=TT.PATH){
    for(let s=0;s<points.length-1;s++){
      const a=points[s],b=points[s+1],steps=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y))*3;
      for(let i=0;i<=steps;i++){
        const q=i/Math.max(1,steps),x=a.x+(b.x-a.x)*q,y=a.y+(b.y-a.y)*q;
        this.paintDisc(x,y,width/2,t);
      }
    }
  }
  addBuilding(spec){
    const b={...spec};
    this.buildings.push(b);
    if(b.enterable){
      for(let y=b.gy;y<b.gy+b.h;y++)for(let x=b.gx;x<b.gx+b.w;x++){
        const edge=x===b.gx||y===b.gy||x===b.gx+b.w-1||y===b.gy+b.h-1;
        this.set(x,y,edge?TT.WALL:TT.FLOOR);

      for(let y=b.gy;y<b.gy+b.h;y++)for(let x=b.gx;x<b.gx+b.w;x++)this.set(x,y,TT.WALL);
    }

  randomOpenTile(r){

      if(t===TT.WATER||t===TT.ROCK||t===TT.TREE||t===TT.WALL)continue;
      let blocked=false;for(const b of this.buildings){if(x>=b.gx-1&&x<b.gx+b.w+1&&y>=b.gy-1&&y<b.gy+b.h+1){blocked=true;break}}

  }
  placeStressBuilding(r,n){

      this.stream[y]=cx;
      const half=(y>C.ROWS*.55&&y<C.ROWS*.64)?3:2;

    }

    // Rocky formations distributed across the enlarged biome.
    for(let n=0;n<Math.round(11*areaScale);n++){
      const cx=10+r()*(C.COLS-20),cy=10+r()*(C.ROWS-20),rr=2+r()*5;

    this.clearRect(188,194,62,56,TT.CLEARING);   // settlement
    this.clearRect(88,108,24,24,TT.CLEARING);    // forest camp
    this.clearRect(151,72,18,18,TT.CLEARING);    // cabin clearing

    // Bridges crossing the water.
    const bridgeYs=[63,136,220,Math.round(C.ROWS*.62),Math.round(C.ROWS*.78),Math.round(C.ROWS*.91)];
    for(const by of bridgeYs){
      const cx=this.stream[by];

    }

    // Main footpaths.
    this.paintPath([{x:25,y:226},{x:48,y:216},{x:78,y:205},{x:106,y:219},{x:129,y:220},{x:158,y:224},{x:195,y:222},{x:230,y:224}],3);

  makeMinimapBase(){

      }else if(t===TT.BUSH){

(function(){

      g.drawImage(S.map.chunkCanvas(cx,cy),cx*ct,cy*ct);chunks++
    }

      continue
    }

(function(){

     nextId:S.nextId}
 },

 },

 },
 load(slot=1){try{
   slot=Math.max(1,Math.min(3,slot|0));let raw=localStorage.getItem(this.keyFor(slot))||localStorage.getItem(this.legacyKeyFor(slot));if(!raw){GW.toast("Save Slot "+slot+" is empty");return false}
   let d=JSON.parse(raw);if(!["0.4.0","0.5.0","0.5.1","0.6.0","0.6.1","0.6.2","0.6.3","0.6.4","0.7.0"].includes(d.version)){GW.toast("Save version mismatch");return false}
   GW.setWorldSize(d.version==="0.7.0"?(d.worldSize||512):256);let S=GW.State;S.seed=d.seed;S.time=d.time;S.map=d.version==="0.7.0"&&d.biome!=="legacy"?new GW.WorldMap(S.seed):new GW.LegacyWorldMap(S.seed);S.pathfinder=new GW.Pathfinder(S.map);S.units=[];S.selected.clear();
   S.buildings=(d.buildings||[]).map(b=>({...b}));S.constructionSites=(d.constructionSites||[]).map(site=>({...site}));S.scavengeNodes=(d.scavengeNodes||[]).map(n=>({...n}));S.resources={coins:1000,metal:1000,...(d.resources||{})};
   S.containers=(d.containers||[]).map(c=>({...c,capacity:c.capacity||24,gx:c.gx!=null?c.gx:Math.floor(c.x/GW.CONFIG.TILE),gy:c.gy!=null?c.gy:Math.floor(c.y/GW.CONFIG.TILE),w:1,h:1}));
   for(const a of d.units){let u=GW.makeUnit(a.team,a.type,a.x,a.y);u.id=a.id;u.hp=a.hp;u.heading=a.heading;u.command=a.command||"idle";u.guardPoint=a.guardPoint||null;u.patrolA=a.patrolA||null;u.patrolB=a.patrolB||null;u.patrolTarget=a.patrolTarget||0;u.squad=a.squad||null;u.scavengeNodeId=a.scavengeNodeId||null;u.buildSiteId=a.buildSiteId||null;
     if(u.type==="building_truck"){
       u.resourceCargo=a.resourceCargo||{metal:0};u.resourceCargoCapacity=a.resourceCargoCapacity||GW.DATA.UNITS.building_truck.resourceCargoCapacity||200;
       u.haulState=a.haulState||"idle";u.mobileStorage=a.mobileStorage||{id:"mobile-"+u.id,mobileUnitId:u.id,name:"Logistics Drone Storage",opened:true,capacity:10,items:[],x:u.x,y:u.y};
       u.mobileStorage.mobileUnitId=u.id;u.mobileStorage.opened=true;u.mobileStorage.capacity=u.mobileStorage.capacity||10
     }if(a.isShip){u.isShip=true;u.name="Groundfall Command Ship";u.gx=a.gx;u.gy=a.gy;u.w=a.w||6;u.h=a.h||6}
     if(a.isHero){u.isHero=true;u.name=a.name||"Main Character";u.baseSpeed=a.baseSpeed||GW.CONFIG.UNITS.hero.speed;u.skills=d.heroSkills||{agility:0,strength:0,intelligence:0};let pr=d.heroProgress||{level:1,xp:0,abilityPoints:0};u.level=pr.level||1;u.xp=pr.xp||0;u.abilityPoints=pr.abilityPoints||0;u.speed=GW.heroSpeed(u)}}
   S.characterProfile=d.characterProfile||"character1";S.activeSaveSlot=slot;S.heroId=d.heroId;S.shipId=d.shipId||((S.units.find(u=>u.isShip)||{}).id??null);S.gameOver=false;S.nextId=d.nextId;GW.Inventory.reset();if(d.inventory){GW.Inventory.items=d.inventory.items||[];GW.Inventory.equipment={...GW.Inventory.equipment,...(d.inventory.equipment||{})};delete GW.Inventory.equipment.arms;delete GW.Inventory.equipment.legs;delete GW.Inventory.equipment.feet}
   Object.assign(S.camera,d.camera);S.formation=d.formation||"square";S.formationAngle=d.formationAngle||0;S.formationPreview=null;S.selectionAnchorId=d.selectionAnchorId||null;S.clockReset=true;
   GW.UI.refreshSelection();GW.UI.refreshSquadButtons();GW.UI.refreshRPG();GW.UI.renderGameMenu();GW.toast("Loaded Save Slot "+slot);return true
 }catch(e){console.error(e);GW.toast("Save could not be loaded");return false}},
 newestSlot(){
   let best=null;for(let n=1;n<=3;n++){let i=this.info(n);if(!i)continue;let t=i.savedAt?Date.parse(i.savedAt):0;if(!best||t>best.t)best={slot:n,t}}
   return best?best.slot:null
 },
 clear(slot){localStorage.removeItem(this.keyFor(slot));localStorage.removeItem(this.legacyKeyFor(slot));GW.UI&&GW.UI.renderGameMenu();GW.toast("Cleared Save Slot "+slot)}
};

 },

    G.UI.hideDefeat();document.getElementById("mainMenuOverlay").classList.add("hidden");
    G.State.paused=false;G.State.clockReset=true;
    if(data.introReveal){
      let ship=G.State.units.find(u=>u.id===G.State.shipId);
      if(ship){
        G.State.camera.z=2.15;G.State.camera.x=ship.x-G.Renderer.w/G.State.camera.z/2;G.State.camera.y=ship.y-G.Renderer.h/G.State.camera.z/2;
        G.State.introCamera={start:performance.now(),duration:2600,from:2.15,to:.72,cx:ship.x,cy:ship.y}
      }
      setTimeout(()=>{if(G.SceneManager.currentName==="gameplay")G.startDisembark()},data.skip?40:450);
      G.toast("Wormhole transit complete")
    }
  },
  exit(){G.State.clockReset=true},
  update(dt){if(!G.State.paused)G.SystemManager.update(dt,systems)},
  render(now){
    if(G.State.introCamera){
      let ic=G.State.introCamera,t=Math.min(1,(now-ic.start)/ic.duration),e=1-Math.pow(1-t,3);
      G.State.camera.z=ic.from+(ic.to-ic.from)*e;
      G.State.camera.x=ic.cx-G.Renderer.w/G.State.camera.z/2;G.State.camera.y=ic.cy-G.Renderer.h/G.State.camera.z/2;G.clampCamera(G.Renderer.w,G.Renderer.h);
      if(t>=1)G.State.introCamera=null
    }
    G.Renderer.draw();G.UI.update()
  }
});
})();

</script>

  <script>
(function(){
const G=GW,C=G.CONFIG;
G.reset=function(opts={}){
  G.setWorldSize(512);let S=G.State;
  S.seed=opts.seed||72491;S.time=0;S.characterProfile=opts.characterProfile||S.characterProfile||"character1";S.activeSaveSlot=opts.saveSlot||S.activeSaveSlot||1;
  S.nextId=1;S.shots=[];S.selected.clear();S.containers=[];S.buildings=[];S.constructionSites=[];S.scavengeNodes=[];S.resources={coins:1000,metal:1000};S.selectedContainer=null;S.heroId=null;S.shipId=null;S.gameOver=false;
  S.buildPreview=null;S.buildMode={active:false,builderId:null,key:null};S.formationPreview=null;S.formationAngle=0;S.selectionAnchorId=null;S.squads={1:[],2:[],3:[],4:[]};S.metrics.pathCalls=0;S.metrics.pathMs=0;
  S.map=new G.WorldMap(S.seed);S.spatial=new G.SpatialHash(240);S.pathfinder=new G.Pathfinder(S.map);G.spawnScenario();
  S.camera.z=opts.intro?2.15:.72;S.camera.x=C.WORLD_W/2-G.Renderer.w/S.camera.z/2;S.camera.y=C.WORLD_H/2-G.Renderer.h/S.camera.z/2;
  S.introCamera=null;G.clampCamera(G.Renderer.w,G.Renderer.h);G.UI&&G.UI.refreshSelection();G.UI&&G.UI.hideDefeat()
};
function boot(){
  G.Renderer.init();G.Input.init();G.UI.init();G.MainMenu.init();G.SystemManager.initAll();G.reset();
  let last=performance.now(),acc=0,fpsLast=last,frames=0;
  document.addEventListener("visibilitychange",()=>{G.State.clockReset=true});
  function frame(now){
    requestAnimationFrame(frame);
    if(G.State.clockReset){last=now;acc=0;G.State.clockReset=false}
    let real=Math.min(C.MAX_FRAME,(now-last)/1000);last=now;frames++;acc+=real;
    let steps=0;
    while(acc>=C.FIXED_DT&&steps<4){G.SceneManager.update(C.FIXED_DT);acc-=C.FIXED_DT;steps++}
    if(steps===4&&acc>=C.FIXED_DT)acc=0;
    G.SceneManager.render(now);
    if(now-fpsLast>=1000){G.State.metrics.fps=frames*1000/(now-fpsLast);frames=0;fpsLast=now}
  }
  G.SceneManager.change("mainMenu");requestAnimationFrame(frame);G.toast("Groundfall v0.7.0 Master ready")
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Sprite Test</title>
<style>
  :root { --bg: #101418; --fg: #dfe7ea; --muted: #8aa0a8; --panel: #0d1419e6; --accent: #36b8ef; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; background: var(--panel); }
  #bar .grp { display: flex; gap: 2px; margin-right: 8px; }
  #bar button { font: inherit; color: var(--fg); background: #22303a; border: 0; border-radius: 4px; padding: 5px 9px; cursor: pointer; }
  #bar button.on { background: var(--accent); color: #041018; }
  #scene { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #sheets { padding: 56px 16px 24px; max-width: 1400px; }
  #sheets h2 { margin: 24px 0 4px; font-size: 16px; }
  #sheets p { margin: 0 0 8px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .row figure { margin: 0; }
  .row figcaption { color: var(--muted); font-size: 12px; margin-top: 4px; }
  canvas.px { image-rendering: pixelated; display: block; max-width: 100%; }
  .sw { display: inline-flex; align-items: center; gap: 6px; width: 150px; margin: 2px 0; font-size: 12px; }
  .sw i { width: 18px; height: 18px; border-radius: 3px; display: inline-block; }
  body.hud-off #bar { display: none; }
  body.hud-off #sheets { padding-top: 8px; }
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="scene"></canvas>
<div id="sheets" hidden></div>
<script src="../../src/render/pixel-data.js"></script>
<script>
'use strict';
// Preview for the pixel-art test set. Query: view=scene|sheets, zoom=0.333|0.667|1,
// tiles=v1|v2, shadows=0|1, t=<seconds> (freeze time), hud=0 (hide controls), only=<sheet>.
const D = window.PIXEL_ART, Q = new URLSearchParams(location.search);
const S = {
  view: Q.get('view') || 'scene', zoom: +(Q.get('zoom') || 0.667), tiles: Q.get('tiles') || 'v2',
  shadows: Q.get('shadows') !== '0', t: Q.has('t') ? +Q.get('t') : null, hud: Q.get('hud') !== '0', only: Q.get('only')
};
if (!S.hud) document.body.classList.add('hud-off');
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const PAL = D.palette.map(c => hex(c.hex)), TEAM = { blue: D.teams.blue.map(hex), red: D.teams.red.map(hex) };
const CODE = {}; [...D.alphabet].forEach((ch, i) => CODE[ch] = i);

// ---- Decoding: palette-indexed strings to canvases (team-coloured or silhouette) ----
const cache = new Map();
function frameCanvas(str, w, h, team, mode){
  const key = str + '|' + team + '|' + mode;
  let c = cache.get(key);
  if (c) return c;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h);
  for (let i = 0; i < w * h; i++){
    const k = CODE[str[i]];
    if (!k) continue;
    const t = D.teamIndex.indexOf(k);
    const rgb = mode === 'silhouette' ? [0, 0, 0] : t >= 0 && team ? TEAM[team][t] : PAL[k - 1];
    img.data.set([rgb[0], rgb[1], rgb[2], 255], i * 4);
  }
  g.putImageData(img, 0, 0);
  cache.set(key, c);
  return c;
}
const spriteFrame = (name, facing, col) => D.sprites[name].frames[facing][col];

// ---- Terrain variant choice (the fix under test: v2) ----
function fmix32(h){
  h ^= h >>> 16; h = Math.imul(h, 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
  return h >>> 0;
}
function tileVariant(v, x, y){
  const T = D.terrain[v];
  if (v === 'v1') return (3 * x + 5 * y) & 3;
  const total = T.weights.reduce((a, b) => a + b, 0);
  let r = fmix32(Math.imul(x, 0x9E3779B1) ^ Math.imul(y, 0x85EBCA77) ^ 0x2545F491) % total;
  for (let i = 0; i < T.weights.length; i++){ if (r < T.weights[i]) return i; r -= T.weights[i]; }
  return 0;
}

// ---- Scene: ~35 Spiders, Vance, 24 hostile drones, the station in every state ----
function mulberry(a){ return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const TILE = 48, FACING_STEP = Math.PI / 4;
const facingTo = (dx, dy) => ((Math.round(Math.atan2(dx, -dy) / FACING_STEP) % 8) + 8) % 8;
const STATES = [['foundation', 0], ['frame', 1], ['near-complete', 2], ['finished', 3], ['working', 4], ['damaged', 8], ['rubble', 9]];
const scene = (() => {
  const r = mulberry(1234), stations = [], units = [];
  STATES.forEach(([state, col], i) => stations.push({ state, col, x: (11 + (i % 3) * 3) * TILE, y: (21 + Math.floor(i / 3) * 3) * TILE }));
  const vance = { sprite: 'vance', team: 'blue', x: 15.5 * TILE, y: 31 * TILE, facing: 0, anim: 'idle', phase: 0 };
  const taken = [[vance.x, vance.y]];
  const free = (x, y, d) => taken.every(([a, b]) => Math.hypot(a - x, b - y) > d) && !stations.some(s => x > s.x - 16 && x < s.x + 112 && y > s.y - 16 && y < s.y + 112);
  // Spiders at work beside the frame and near-complete sites face the structure.
  for (const s of stations.slice(0, 3)) for (const [ox, oy] of [[0.5, 1.45], [1.5, 0.55]]){
    const x = s.x + ox * TILE, y = s.y + oy * TILE;
    units.push({ sprite: 'spider', team: 'blue', x, y, facing: facingTo(s.x + TILE - x, s.y + TILE - y), anim: 'work', phase: r() });
    taken.push([x, y]);
  }
  while (units.length < 35){
    const x = (8.5 + r() * 14) * TILE, y = (29.5 + r() * 9) * TILE;
    if (!free(x, y, 40)) continue;
    taken.push([x, y]);
    const moving = r() < 0.5;
    units.push({ sprite: 'spider', team: 'blue', x, y, facing: moving ? facingTo(r() - 0.5, -0.8) : Math.floor(r() * 8), anim: moving ? 'walk' : 'idle', phase: r() });
  }
  for (let n = 0; n < 24;){
    const x = (7.5 + r() * 16) * TILE, y = (11 + r() * 8.5) * TILE;
    if (!free(x, y, 34)) continue;
    taken.push([x, y]); n++;
    units.push({ sprite: 'drone', team: 'red', x, y, facing: facingTo(vance.x - x + (r() - 0.5) * 300, vance.y - y), anim: 'fly', phase: r(), air: true });
  }
  // Salvage Crawlers with their hoppers at each fill level (their own seed, so nothing above moves).
  const rc = mulberry(4321);
  for (let n = 0; n < 4;){
    const x = (11.5 + rc() * 8) * TILE, y = (19.4 + rc() * 0.9) * TILE;
    if (!free(x, y, 46)) continue;
    taken.push([x, y]);
    units.push({ sprite: 'salvage_crawler', team: 'blue', x, y, facing: Math.floor(rc() * 8), anim: n % 2 ? 'walk' : 'work', variant: n, phase: rc() }); n++;
  }
  units.push(vance);
  // Sentry Turrets in the gaps between the stations, their heads turned toward the drones (fixed places,
  // so nothing above moves). One is damaged and one has just fired.
  const turrets = [[13, 23, 'finished'], [16, 23, 'firing'], [16, 26, 'damaged']].map(([gx, gy, state]) => ({ x: gx * TILE, y: gy * TILE, state, aim: Math.atan2(15 * TILE - (gy + 0.5) * TILE, 15 * TILE - (gx + 0.5) * TILE) }));
  // A walled yard left of the stations: all three walls, a 1×2 gate across the top (open) and a
  // vertical one on the east side, each wall tile joined to its neighbours and the gate ends.
  const walls = [];
  const wall = (key, gx, gy) => walls.push({ key, gx, gy });
  for (const x of [5, 6, 7]) wall('defensive_wall', x, 21);
  for (let y = 22; y <= 26; y++) wall('wood_wall', 5, y);
  for (let x = 5; x <= 9; x++) wall('reinforced_wall', x, 27);
  for (const y of [25, 26]) wall('reinforced_wall', 9, y);
  const gates = [{ key: 'gate', gx: 8, gy: 21, w: 2, h: 1, state: 'open' }, { key: 'gate_v', gx: 9, gy: 23, w: 1, h: 2, state: 'finished' }];
  const at = new Map(walls.map(w => [w.gx + ',' + w.gy, 'wall']));
  for (const g of gates) for (let y = g.gy; y < g.gy + g.h; y++) for (let x = g.gx; x < g.gx + g.w; x++) at.set(x + ',' + y, g.w > g.h ? 'gate-h' : 'gate-v');
  for (const w of walls){
    const j = (dx, dy) => { const k = at.get((w.gx + dx) + ',' + (w.gy + dy)); return k === 'wall' || (k === 'gate-h' && dx) || (k === 'gate-v' && dy); };
    w.mask = (j(0, -1) ? 1 : 0) | (j(1, 0) ? 2 : 0) | (j(0, 1) ? 4 : 0) | (j(-1, 0) ? 8 : 0);
  }
  return { stations, turrets, walls, gates, units, cx: 15 * TILE, cy: 26 * TILE };
})();

const cv = document.getElementById('scene'), g = cv.getContext('2d');
let shadowCv = document.createElement('canvas');
function drawScene(time){
  const dpr = window.devicePixelRatio || 1, W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; shadowCv.width = W; shadowCv.height = H; }
  const k = S.zoom * dpr, ap = D.sprites.spider.worldPxPerArtPx * k;   // device px per world px / per sprite art px
  const ox = W / 2 - scene.cx * k, oy = H / 2 - scene.cy * k;
  g.imageSmoothingEnabled = false;
  // Terrain
  const T = D.terrain[S.tiles], tpx = TILE * k;
  const tx0 = Math.floor(-ox / tpx), ty0 = Math.floor(-oy / tpx), tx1 = Math.ceil((W - ox) / tpx), ty1 = Math.ceil((H - oy) / tpx);
  for (let ty = ty0; ty < ty1; ty++) for (let tx = tx0; tx < tx1; tx++){
    const x0 = Math.round(ox + tx * tpx), y0 = Math.round(oy + ty * tpx), x1 = Math.round(ox + (tx + 1) * tpx), y1 = Math.round(oy + (ty + 1) * tpx);
    g.drawImage(frameCanvas(T.tiles[tileVariant(S.tiles, tx, ty)], D.tileArt, D.tileArt), x0, y0, x1 - x0, y1 - y0);
  }
  // Sprites are placed on whole device pixels and scaled by nearest neighbour.
  // Each sprite has its own world px per art px (units and structures: ½).
  const place = (str, w, h, wx, wy, origin, team, mode, off, sp) => {
    const a = (sp ? sp.worldPxPerArtPx : D.worldPxPerArtPx) * k;
    const x = Math.round(ox + wx * k - (origin[0] + 0.5) * a + (off ? off[0] * a : 0)), y = Math.round(oy + wy * k - (origin[1] + 0.5) * a + (off ? off[1] * a : 0));
    const c = frameCanvas(str, w, h, team, mode);
    return [c, x, y, Math.round(w * a), Math.round(h * a)];
  };
  const unitFrame = u => {
    const sp = D.sprites[u.sprite], a = sp.animations[u.anim], t = time + u.phase * 3, block = sp.variants ? (u.variant || 0) * sp.variants.framesEach : 0;
    return spriteFrame(u.sprite, u.facing, block + a.start + Math.floor(t * a.fps) % a.frames);
  };
  const stationFrame = s => {
    const st = D.sprites.repair_station, col = s.state === 'working' ? st.states.working.start + Math.floor(time * st.states.working.fps) % st.states.working.frames : s.col;
    return st.frames[0][col];
  };
  // Engine shadows: silhouettes stamped into one mask, then darken what's underneath by 55%.
  const shadowPass = draws => {
    if (!S.shadows) return;
    const sg = shadowCv.getContext('2d');
    sg.imageSmoothingEnabled = false; sg.clearRect(0, 0, W, H);
    for (const [c, x, y, w, h] of draws) sg.drawImage(c, x, y, w, h);
    g.globalAlpha = 0.55; g.drawImage(shadowCv, 0, 0); g.globalAlpha = 1;
  };
  const st = D.sprites.repair_station;
  shadowPass(scene.stations.map(s => place(stationFrame(s), st.frameWidth, st.frameHeight, s.x, s.y, st.origin, null, 'silhouette', st.shadow.offset, st)));
  for (const s of scene.stations){ const [c, x, y, w, h] = place(stationFrame(s), st.frameWidth, st.frameHeight, s.x, s.y, st.origin, 'blue', undefined, undefined, st); g.drawImage(c, x, y, w, h); }
  // Walls and gates: every shadow first (so none falls on a neighbour), then the pieces.
  const fort = [...scene.walls.map(w => { const sp = D.sprites[w.key]; return { sp, str: sp.frames[0][sp.states.finished.start + w.mask], x: w.gx * TILE, y: w.gy * TILE }; }),
    ...scene.gates.map(q => { const sp = D.sprites[q.key]; return { sp, str: sp.frames[0][sp.states[q.state].start], x: q.gx * TILE, y: q.gy * TILE }; })];
  shadowPass(fort.map(f => place(f.str, f.sp.frameWidth, f.sp.frameHeight, f.x, f.y, f.sp.origin, null, 'silhouette', f.sp.shadow.offset, f.sp)));
  for (const f of fort){ const [c, x, y, w, h] = place(f.str, f.sp.frameWidth, f.sp.frameHeight, f.x, f.y, f.sp.origin, 'blue', undefined, undefined, f.sp); g.drawImage(c, x, y, w, h); }
  // Turrets: the base, then the head in the facing nearest its aim, its shadow on the base.
  const tu = D.sprites.sentry_turret, TH = tu.head;
  const turretBase = s => tu.frames[0][tu.states[s.state === 'damaged' ? 'damaged' : 'finished'].start];
  const turretHead = s => { const f = ((Math.round((s.aim + Math.PI / 2) / (Math.PI * 2 / TH.facings)) % TH.facings) + TH.facings) % TH.facings, a = TH.states[s.state === 'finished' ? 'idle' : s.state]; return TH.frames[f][a.start + (a.fps ? Math.floor(time * a.fps) % a.frames : 0)]; };
  shadowPass(scene.turrets.map(s => place(turretBase(s), tu.frameWidth, tu.frameHeight, s.x, s.y, tu.origin, null, 'silhouette', tu.shadow.offset, tu)));
  for (const s of scene.turrets){
    for (const [str, mode] of [[turretBase(s)], [turretHead(s), 'silhouette'], [turretHead(s)]]){
      const [c, x, y, w, h] = place(str, tu.frameWidth, tu.frameHeight, s.x, s.y, tu.origin, mode ? null : 'blue', mode, mode ? tu.shadow.offset : undefined, tu);
      if (mode){ g.globalAlpha = 0.55; g.drawImage(c, x, y, w, h); g.globalAlpha = 1; } else g.drawImage(c, x, y, w, h);
    }
  }
  shadowPass(scene.units.map(u => { const sp = D.sprites[u.sprite]; return place(unitFrame(u), sp.frameWidth, sp.frameHeight, u.x, u.y, sp.origin, null, 'silhouette', sp.shadow.offset, sp); }));
  const order = [...scene.units].sort((a, b) => (a.air ? 2 : a.sprite === 'vance' ? 1 : 0) - (b.air ? 2 : b.sprite === 'vance' ? 1 : 0));
  for (const u of order){ const sp = D.sprites[u.sprite], [c, x, y, w, h] = place(unitFrame(u), sp.frameWidth, sp.frameHeight, u.x, u.y, sp.origin, u.team, undefined, undefined, sp); g.drawImage(c, x, y, w, h); }
  // Label, so screenshots say what they show.
  const label = `zoom ${({ 0.333: '⅓', 0.667: '⅔', 1: '1' })[S.zoom] || S.zoom} · ${innerWidth}×${innerHeight} @${dpr}x · tiles ${S.tiles} · ${ap.toFixed(2)} device px per art px`;
  g.font = `${12 * dpr}px system-ui, sans-serif`;
  const tw = g.measureText(label).width;
  g.fillStyle = '#0d1419d0'; g.fillRect(8 * dpr, H - 30 * dpr, tw + 16 * dpr, 22 * dpr);
  g.fillStyle = '#dfe7ea'; g.fillText(label, 16 * dpr, H - 14 * dpr);
}

// ---- Sheets view ----
function scaled(str, w, h, team, k, bg){
  const c = document.createElement('canvas'); c.width = w * k; c.height = h * k; c.className = 'px';
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  if (bg){ x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
  x.drawImage(frameCanvas(str, w, h, team), 0, 0, w * k, h * k);
  return c;
}
function sheetCanvas(rows, w, h, team, k, bg){
  const cols = Math.max(...rows.map(r => r.length)), gap = 2;
  const c = document.createElement('canvas'); c.width = cols * (w + gap) * k; c.height = rows.length * (h + gap) * k; c.className = 'px';
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
  rows.forEach((row, ry) => row.forEach((str, rx) => x.drawImage(frameCanvas(str, w, h, team), rx * (w + gap) * k, ry * (h + gap) * k, w * k, h * k)));
  return c;
}
function fig(el, caption){ const f = document.createElement('figure'); f.append(el); const c = document.createElement('figcaption'); c.textContent = caption; f.append(c); return f; }
function section(title, note){ const d = document.createElement('section'); d.innerHTML = `<h2>${title}</h2><p>${note}</p>`; const row = document.createElement('div'); row.className = 'row'; d.append(row); return [d, row]; }
function buildSheets(){
  const root = document.getElementById('sheets'); root.innerHTML = '';
  const want = n => !S.only || S.only === n;
  for (const name of ['spider', 'salvage_crawler', 'drone', 'vance']) if (want(name)){
    const sp = D.sprites[name], anims = Object.entries(sp.animations).map(([a, v]) => `${a} ${v.frames}f @ ${v.fps} fps`).join(' · ');
    const how = sp.authoredFacings ? 'only up and up-right authored' : 'each rendered from the model', blocks = sp.variants ? `, repeated for ${sp.variants.by}: ${sp.variants.values.join(', ')}` : '';
    const [d, row] = section(`${name} — ${sp.frameWidth}×${sp.frameHeight}`, `Rows: ${sp.facings.join(', ')} (${how}). Columns: ${anims}${blocks}. Shadow: engine, offset ${sp.shadow.offset.join(',')} art px.`);
    const k = name === 'drone' ? 2 : 1;   // frames are 2 art px per world px
    row.append(fig(sheetCanvas(sp.frames, sp.frameWidth, sp.frameHeight, null, k, '#3a3129'), 'raw sheet (magenta team ramp)'));
    row.append(fig(sheetCanvas(sp.frames, sp.frameWidth, sp.frameHeight, 'blue', k, '#3a3129'), 'blue team'));
    row.append(fig(sheetCanvas(sp.frames, sp.frameWidth, sp.frameHeight, 'red', k, '#3a3129'), 'red team'));
    root.append(d);
  }
  if (want('repair_station')){
    const st = D.sprites.repair_station, names = [];
    for (const [s, v] of Object.entries(st.states)) for (let i = 0; i < v.frames; i++) names.push(v.frames > 1 ? `${s} ${i + 1}` : s);
    const [d, row] = section(`repair station — ${st.frameWidth}×${st.frameHeight} (2×2 tiles)`, 'Stand-in design. States left to right: ' + names.join(', ') + '.');
    for (const team of [null, 'blue', 'red']) row.append(fig(sheetCanvas(st.frames, st.frameWidth, st.frameHeight, team, 1, '#3a3129'), team ? team + ' team' : 'raw sheet (magenta)'));
    root.append(d);
  }
  if (want('walls')){
    for (const name of ['wood_wall', 'defensive_wall', 'reinforced_wall', 'gate', 'gate_3', 'gate_4', 'gate_v', 'gate_3_v', 'gate_4_v']){
      const sp = D.sprites[name], names = Object.entries(sp.states).map(([s, v]) => v.connect ? `${s} (16 pieces by neighbour mask)` : s).join(', ');
      const [d, row] = section(`${name} — ${sp.frameWidth}×${sp.frameHeight}`, `States left to right: ${names}. Mask bits: 1 north, 2 east, 4 south, 8 west.`);
      for (const team of [null, 'blue']) row.append(fig(sheetCanvas(sp.frames, sp.frameWidth, sp.frameHeight, team, 1, '#3a3129'), team ? team + ' team' : 'raw sheet (magenta)'));
      root.append(d);
    }
  }
  if (want('sentry_turret')){
    const tu = D.sprites.sentry_turret, H = tu.head, names = [];
    for (const [s, v] of Object.entries(tu.states)) for (let i = 0; i < v.frames; i++) names.push(v.frames > 1 ? `${s} ${i + 1}` : s);
    const heads = Object.entries(H.states).map(([s, v]) => `${s} ${v.frames}f${v.fps ? ' @ ' + v.fps + ' fps' : ''}`).join(' · ');
    const [d, row] = section(`sentry turret — ${tu.frameWidth}×${tu.frameHeight} (1×1 tile), modelled in the sprite lab`, `Base states left to right: ${names.join(', ')}. The head is its own layer, drawn over ${Object.entries(H.on).map(([b, h]) => b + ' (' + h + ')').join(' and ')} in the facing nearest the turret's aim: ${H.facings} rows, clockwise from up; columns ${heads}.`);
    for (const team of [null, 'blue', 'red']) row.append(fig(sheetCanvas(tu.frames, tu.frameWidth, tu.frameHeight, team, 1, '#3a3129'), team ? team + ' team base' : 'raw base (magenta)'));
    for (const team of [null, 'blue']) row.append(fig(sheetCanvas(H.frames, tu.frameWidth, tu.frameHeight, team, 1, '#3a3129'), team ? team + ' team head' : 'raw head (magenta)'));
    root.append(d);
  }
  if (want('woodlands') && D.woodlands){
    const W = D.woodlands, A = D.tileArt, off = W.tree.shadow.offset;
    const [d, row] = section(`woodlands pilot — ${A}×${A} tiles and tree props`, `Grass, tall grass, water and deep water: 8 weighted, edge-matched variants each. Shoreline: 16 pieces by which sides touch land (1 N, 2 E, 4 S, 8 W). Cliffs: one tile tall, a piece per dropping side. Trees: oak, pine and birch canopy props with 9 frames each, 3 leans × 3 leaf-rustle steps (set by the weather), outline by the pipeline, engine shadow at ${off.join(',')}.`);
    for (const key of ['grass', 'tall_grass', 'water', 'deep_water', 'shore', 'cliff']){
      const strip = document.createElement('div'); strip.className = 'row';
      W[key].tiles.forEach((s, i) => strip.append(fig(scaled(s, A, A, null, 2), key === 'cliff' ? W.cliff.pieces[i] : key === 'shore' ? 'mask ' + i : W[key].weights ? `${i} w${W[key].weights[i]}` : String(i))));
      row.append(fig(strip, key.replace('_', ' ')));
    }
    for (const kind of W.tree.types){
      const strip = document.createElement('div'); strip.className = 'row';
      W.tree.variants[kind].forEach((frames, v) => frames.forEach((s, f) => strip.append(fig(scaled(s, A, A, null, 2), `v${v + 1} lean ${Math.floor(f / 3)} leaves ${f % 3}`))));
      row.append(fig(strip, kind + ' tree: 3 leans (0, 2, 4 art px downwind) × 3 leaf-rustle steps'));
    }
    root.append(d);
  }
  if (want('terrain')){
    const A = D.tileArt;
    const [d, row] = section(`dust plain terrain — ${A}×${A} tiles`, 'v1 is the tested set: 4 variants picked by (3x + 5y) & 3, which forms diagonal bands at a distance. v2 is the fix: 8 weighted, edge-matched variants picked by a mixing hash.');
    for (const v of ['v1', 'v2']){
      const T = D.terrain[v], strip = document.createElement('div'); strip.className = 'row';
      T.tiles.forEach((s, i) => strip.append(fig(scaled(s, A, A, null, 2), `${v}.${i} w${T.weights[i]}`)));
      row.append(fig(strip, `${v} variants`));
    }
    const row2 = document.createElement('div'); row2.className = 'row';
    for (const v of ['v1', 'v2']){
      const n = 12, c = document.createElement('canvas'); c.width = c.height = n * A; c.className = 'px';
      const x = c.getContext('2d');
      for (let ty = 0; ty < n; ty++) for (let tx = 0; tx < n; tx++) x.drawImage(frameCanvas(D.terrain[v].tiles[tileVariant(v, tx, ty)], A, A), tx * A, ty * A);
      row2.append(fig(c, `${v}: ${A}×${A} tiles, one screen px per art px`));
    }
    d.append(row2);
    root.append(d);
    const [dp, rp] = section(`palette — ${D.palette.length} colours`, 'team0–team2 are magenta placeholders, replaced per team at load.');
    const wrap = document.createElement('div');
    for (const c of D.palette){ const s = document.createElement('span'); s.className = 'sw'; s.innerHTML = `<i style="background:${c.hex}"></i>${c.name} ${c.hex}`; wrap.append(s); }
    rp.append(wrap);
    root.append(dp);
  }
}

// ---- Controls ----
function bar(){
  const b = document.getElementById('bar'); b.innerHTML = '';
  const grp = (items, cur, set) => {
    const gdiv = document.createElement('div'); gdiv.className = 'grp';
    for (const [label, val] of items){
      const btn = document.createElement('button'); btn.textContent = label; if (val === cur) btn.className = 'on';
      btn.onclick = () => { set(val); bar(); show(); };
      gdiv.append(btn);
    }
    b.append(gdiv);
  };
  grp([['Scene', 'scene'], ['Sheets', 'sheets']], S.view, v => S.view = v);
  if (S.view === 'scene'){
    grp([['⅓', 0.333], ['⅔', 0.667], ['1', 1]], S.zoom, v => S.zoom = v);
    grp([['Tiles v1', 'v1'], ['Tiles v2', 'v2']], S.tiles, v => S.tiles = v);
    grp([['Shadows', true], ['None', false]], S.shadows, v => S.shadows = v);
  }
}
let raf = 0;
function show(){
  cancelAnimationFrame(raf);
  const scn = S.view === 'scene';
  cv.hidden = !scn; document.getElementById('sheets').hidden = scn;
  if (!scn){ buildSheets(); window.PREVIEW_READY = true; return; }
  const t0 = performance.now();
  const loop = () => { drawScene(S.t != null ? S.t : (performance.now() - t0) / 1000); window.PREVIEW_READY = true; if (S.t == null) raf = requestAnimationFrame(loop); };
  loop();
}
addEventListener('resize', () => { if (S.view === 'scene' && S.t != null) drawScene(S.t); });
bar(); show();
</script>

<title>Utility Spider — animation test</title>
<style>
:root{--bg:#1b2026;--panel:#262d35;--ink:#dfe6ea;--dim:#8d99a3;--cyan:#39e6f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b2026}}
:root[data-theme="dark"]{--bg:#1b2026}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:12px 16px 4px}h1{font-size:18px;margin:0}
p{margin:2px 0 0;color:var(--dim);font-size:13px}
#wrap{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px}
button{background:var(--panel);color:var(--ink);border:1px solid #3a444f;border-radius:6px;padding:9px 12px;font:inherit;font-size:14px}
button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style></head><body>

  if(U.move==='hover'&&!reduced){hover=Math.sin(T*2.2)*1.5;sway=Math.sin(T*1.3)*0.02}

  const lift=reduced?0:U.idleLift*(1-S.gait)*(0.5+0.5*Math.sin(T*6.2832/U.idlePeriod)),bs=1+lift;
  // shadow (further away when hovering)
  x.save();x.translate(S.x,S.y);x.fillStyle=U.move==='hover'?'rgba(0,0,0,0.25)':'rgba(0,0,0,0.35)';
  const so=(U.move==='hover'?12+hover:4)+lift*120;x.beginPath();x.ellipse(so,so+2,62*K,58*K,0,0,6.28);x.fill();x.restore();
  x.save();x.translate(S.x,S.y);x.rotate(S.bodyAng+Math.PI/2+sway);x.translate(0,bob+hover);
  for(const L of legs){const ph=L.g==='A'?S.walk:S.walk+Math.PI;
    const sw=Math.sin(ph)*U.swing*amp,lift=1+(Math.cos(ph)>0?Math.cos(ph)*0.06*amp:0),side=L.px>SPRITE/2?1:-1;
    x.save();x.translate((L.px-SPRITE/2)*bs,(L.py-SPRITE/2)*bs-bob);x.rotate(-side*sw);x.scale(lift,lift);x.translate(-L.px,-L.py);
    x.drawImage(L.img,0,0);lights(L.lights,0,0,2.2,p=>reduced?0.5:0.35+0.3*Math.sin(T*3+p.ph));x.restore()}
  x.scale(bs,bs);x.drawImage(body,-SPRITE/2,-SPRITE/2);
  lights(bL,SPRITE/2,SPRITE/2,2.2,p=>reduced?0.5:0.35+0.3*Math.sin(T*3+p.ph));
  x.restore();
  if(tur){const kick=U.weapon==='bullets'&&S.cool>U.fireInterval/2?1.5:0;
    x.save();x.translate(S.x,S.y);x.rotate(S.turAng+Math.PI/2);x.translate(0,bob+hover+kick);x.scale(bs,bs);
    x.drawImage(tur,-SPRITE/2,-SPRITE/2);
    lights(tL,SPRITE/2,SPRITE/2,2.5,p=>0.5+0.4*S.spin*Math.abs(Math.sin(T*20)));x.restore()}
  x.globalCompositeOperation='lighter';
  if(U.weapon==='laser'){const aim=tur?S.turAng:S.bodyAng,m=U.muzzles[0],[mx,my]=toWorld(m[0],m[1],aim);
    if(S.spin>0&&S.cool>0&&!beamTarget){const ch=1-S.cool/U.fireInterval;glow(mx,my,4+ch*14,0.3+ch*0.6)}
    if(beamTarget){x.lineCap='round';for(const[w,a]of[[10,0.25*S.beam],[4,0.8*S.beam],[1.5,S.beam]]){
      x.strokeStyle=`rgba(${w<2?'230,255,255':'90,240,255'},${a})`;x.lineWidth=w;x.beginPath();x.moveTo(mx,my);x.lineTo(beamTarget.x,beamTarget.y);x.stroke()}}}
  x.lineCap='round';for(const b of bullets){x.strokeStyle='rgba(255,220,120,0.9)';x.lineWidth=2;x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x-b.vx*0.02,b.y-b.vy*0.02);x.stroke()}
  for(const f of flashes){x.save();x.translate(f.x,f.y);x.rotate(f.a);
    const g=x.createRadialGradient(4,0,0,4,0,14);g.addColorStop(0,'rgba(255,250,200,1)');g.addColorStop(0.4,'rgba(255,190,80,0.8)');g.addColorStop(1,'rgba(255,120,40,0)');
    x.fillStyle=g;x.beginPath();x.ellipse(6,0,14,6,0,0,6.28);x.fill();x.restore()}
  for(const s of sparks){x.fillStyle=`rgba(255,200,110,${s.life*3})`;x.fillRect(s.x-1,s.y-1,2,2)}
  x.globalCompositeOperation='source-over'}
Promise.all([load(U.body),U.turret?load(U.turret):null,...U.legs.map(l=>load(l.img))]).then(([a,b,...ls])=>{
  body=a;tur=b;bL=findLights(a);if(b)tL=findLights(b);
  legs=U.legs.map((l,i)=>({...l,img:ls[i],lights:findLights(ls[i])}));
  if(U.weapon!=='none'){addTarget();addTarget()}requestAnimationFrame(step)});
</script></body></html>

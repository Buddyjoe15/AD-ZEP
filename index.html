<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111713">
  <title>Abyssal Dawn: Zero Earth Protocol</title>
  <!-- Development entry point: opens directly from disk, no build step.
       `npm run build` inlines everything below into dist/ad-ezp.html. -->
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/expedition.css">
  <link rel="stylesheet" href="src/styles/debug.css">
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Expedition map"></canvas>
    <canvas id="gpu" aria-hidden="true"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>

    <div id="mainMenuOverlay">
      <div class="space-art">
        <div class="star-layer stars-a"></div><div class="star-layer stars-b"></div>
        <div class="twinkle-star t1"></div><div class="twinkle-star t2"></div><div class="twinkle-star t3"></div><div class="twinkle-star t4"></div><div class="twinkle-star t5"></div>
        <div class="moon-orb"></div>
        <div class="earth-wrap"><div class="earth-orb"><div class="earth-clouds"></div></div>
          <div class="ship-orbit"><div class="menu-ship"><i></i><i></i><i></i></div></div>
        </div>
      </div>
      <div class="main-menu-title">ZERO EARTH PROTOCOL <span class="version-label"></span></div>
      <button id="mainMenuBackBtn" class="main-back hidden">← Back</button>
      <div id="mainMenuPanel"></div>
    </div>
    <div id="wormholeIntro" class="hidden">
      <div class="wormhole-core"></div><div class="wormhole-flash f1"></div><div class="wormhole-flash f2"></div><div class="wormhole-flash f3"></div>
      <button id="introSkipBtn">Skip</button>
    </div>

    <div id="economyBar" aria-label="Economy"></div>
    <div id="squadBar" aria-label="Squads">
      <button id="squadBtn1" title="Select Squad 1"><span>1</span></button>
      <button id="squadBtn2" title="Select Squad 2"><span>2</span></button>
      <button id="squadBtn3" title="Select Squad 3"><span>3</span></button>
      <button id="squadBtn4" title="Select Squad 4"><span>4</span></button>
    </div>
    <div id="gameTitle">ZERO EARTH PROTOCOL <span class="version-label"></span></div>
    <button id="dbgBtn" type="button">DEBUG</button>
    <button id="mapEdBtn" type="button" class="hidden">MAP EDITOR</button>
    <div id="status" aria-live="polite"></div>
    <button id="ezToggle" aria-expanded="false">Expedition log</button>
    <div id="topRightControls">
      <button id="performanceBtn" title="Performance statistics">FPS</button>
      <button id="fullscreenBtn" title="Fullscreen">⛶</button>
      <button id="menuBtn" title="Game Menu">Menu</button>
    </div>

    <div id="catalogPanel" class="panel catalog hidden"></div>
    <div id="selectionPanel" class="panel"></div>
    <div id="targetPanel" class="panel hidden" aria-label="Enemy info"></div>
    <div id="miniSideControls"><button id="inventoryBtn">Inventory</button></div>
    <canvas id="minimap" width="220" height="220" aria-label="Minimap"></canvas>
    <button id="pauseBtn" class="mini-pause">Pause</button>
    <div id="inventoryPanel" class="panel rpg hidden"></div>
    <div id="chestPanel" class="panel rpg hidden"></div>
    <div id="devPanel" class="panel dev hidden"></div>
    <div id="dbgPanel" class="hidden"></div>
    <div id="mapEdPanel" class="hidden"></div>
    <aside id="ezFabrication" class="hidden" aria-label="Fabrication"><div id="ezFabBody"></div></aside>
    <aside id="spawnerPanel" class="hidden" aria-label="Spawner"><div id="spawnerBody"></div></aside>
    <aside id="shieldPanel" class="hidden" aria-label="Shield Projector"><div id="shieldBody"></div></aside>
    <aside id="ezPanel" class="hidden"><div class="panel-drag-head ezDragHead" data-drag-handle title="Drag to move"><button type="button" class="panel-close" id="ezClose" aria-label="Close expedition log">×</button><h3>Expedition log</h3></div><div id="ezBody"></div></aside>
    <div id="ezArrival" class="hidden"></div>
    <input type="file" id="ezFile" accept=".json,application/json" hidden>

    <div id="gameMenuOverlay" class="hidden">
      <div id="gameMenuCard">
        <div class="game-menu-header"><div><b>ZERO EARTH PROTOCOL</b><span>Game Menu</span></div><button id="closeMenuBtn">×</button></div>
        <div class="game-menu-tabs">
          <button data-menu-tab="overview" class="active">Game</button>
          <button data-menu-tab="stats">Statistics</button>
          <button data-menu-tab="saves">Save / Load</button>
          <button data-menu-tab="options">Options</button>
        </div>
        <div id="gameMenuContent"></div>
      </div>
    </div>
    <div id="defeatOverlay" class="hidden">
      <div class="defeat-card"><h2>DEFEAT</h2><p id="defeatReason"></p><button id="restartAfterDefeatBtn">Restart</button></div>
    </div>
    <div id="toast"></div>
  </div>

  <!-- Simulation layer: no DOM access; also loaded headless by the Node tests. -->
  <script src="src/core/namespace.js"></script>
  <script src="src/core/util.js"></script>
  <script src="src/core/config.js"></script>
  <script src="src/core/events.js"></script>
  <script src="src/core/registry.js"></script>
  <script src="src/core/systems.js"></script>
  <script src="src/core/state.js"></script>
  <script src="src/data/terrain.js"></script>
  <script src="src/data/resources.js"></script>
  <script src="src/data/units.js"></script>
  <script src="src/data/items.js"></script>
  <script src="src/data/buildables.js"></script>
  <script src="src/data/world.js"></script>
  <script src="src/world/grid.js"></script>
  <script src="src/world/mapgen.js"></script>
  <script src="src/world/spatial.js"></script>
  <script src="src/world/pathfinding.js"></script>
  <script src="src/sim/entities.js"></script>
  <script src="src/sim/economy.js"></script>
  <script src="src/sim/power.js"></script>
  <script src="src/sim/buildings.js"></script>
  <script src="src/sim/defense.js"></script>
  <script src="src/sim/inventory.js"></script>
  <script src="src/sim/orders.js"></script>
  <script src="src/sim/swarm.js"></script>
  <script src="src/sim/movement.js"></script>
  <script src="src/sim/combat.js"></script>
  <script src="src/sim/gather.js"></script>
  <script src="src/sim/construction.js"></script>
  <script src="src/sim/fabrication.js"></script>
  <script src="src/sim/spawner.js"></script>
  <script src="src/sim/expedition.js"></script>
  <script src="src/sim/scenario.js"></script>
  <script src="src/sim/save.js"></script>
  <script src="src/sim/debugtools.js"></script>
  <!-- Presentation layer: canvas rendering, DOM interface and input. -->
  <script src="src/render/pixel-data.js"></script>
  <script src="src/render/pixelart.js"></script>
  <script src="src/render/visuals.js"></script>
  <script src="src/render/terrain.js"></script>
  <script src="src/render/fog.js"></script>
  <script src="src/render/sprites.js"></script>
  <script src="src/render/gpu.js"></script>
  <script src="src/render/renderer.js"></script>
  <script src="src/ui/hud.js"></script>
  <script src="src/ui/inventory.js"></script>
  <script src="src/ui/build.js"></script>
  <script src="src/ui/expedition.js"></script>
  <script src="src/ui/spawner.js"></script>
  <script src="src/ui/shield.js"></script>
  <script src="src/ui/debug.js"></script>
  <script src="src/ui/mapeditor.js"></script>
  <script src="src/ui/input.js"></script>
  <script src="src/ui/menu.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
